services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rks
      POSTGRES_PASSWORD: rks
      POSTGRES_DB: rks
    ports:
      - "5432:5432"
    volumes:
      - rks_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rks -d rks"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  rks_pg:
